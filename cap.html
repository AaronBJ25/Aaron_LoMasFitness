<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="En LoMás Fitness puedes encontrar una familia donde mejorar tus hábitos a través de nuestros servicios">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aaronbj25.github.io/Aaron_LoMasFitness/" />
    <meta property="og:title" content="LoMás Fitness" />
    <meta property="og:description" content="En LoMás Fitness puedes encontrar una familia donde mejorar tus hábitos a través de nuestros servicios" />
    <meta property="og:image" content="https://aaronbj25.github.io/Aaron_LoMasFitness/media/preview.jpg" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aaronbj25.github.io/Aaron_LoMasFitness/" />
    <meta property="twitter:title" content="LoMás Fitness" />
    <meta property="twitter:description" content="En LoMás Fitness puedes encontrar una familia donde mejorar tus hábitos a través de nuestros servicios" />
    <meta property="twitter:image" content="https://aaronbj25.github.io/Aaron_LoMasFitness/media/preview.jpg" />
    <link rel="icon" href="media/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-medium.png">
    <link rel="icon" type="image/png" sizes="16x16" href="media/favicon-small.png">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.min.css">
    <script defer src="js/index.js"></script>
    <script defer src="js/single_product.js"></script>
    <title>LoMás Fitness - Gorra</title>
</head>
<body>
    <!-- Header: Contiene el logo, el menú de navegación y el carrito de la compra -->
    <header class="header flex-row">
        <a href="index.html" title="Volver al inicio de la web">
            <picture>
                <source srcset="media/logo.svg" type="image/svg+xml">
                <img class="header__logo" src="media/logo.jpg" alt="Ir al inicio de la web">
            </picture>
        </a>
        <nav class="header__nav flex-row">
            <button id="menuBtn" class="link" title="Abrir menú lateral"><i class="ri-menu-line"></i></button>  
            <ul class="menu__links flex-row" id="menuLinks">
                <li><button id="closeBtn" class="close-btn link" title="Cerrar menú lateral"><i class="ri-close-large-line"></i></button></li>
                <li><a href="index.html" title="Enlace para volver al inicio de la web" class="menu__link link">Inicio</a></li>
                <li><a href="productos.html" title="Enlace para ir a nuestra página de productos" class="menu__link link">Productos </a></li>
                <li><button id="servicesBtn" class="menu__link link" title="Botón para ir a nuestra sección de servicios">Servicios</button></li>
                <li><button id="reviewsBtn" class="menu__link link" title="Botón para ir a nuestra sección de reseñas">Reseñas</button></li>
                <li><a href="contacto.html" title="Enlace para poder ponerte en contacto con nosotros" class="menu__link link">Contacto</a></li>
                <li><button id="cartBtn" class="link" title="Botón para abrir el carrito"><i class="ri-shopping-cart-line"></i></button></li>
                <li><span class="red-dot"></span></li>
            </ul>
        </nav>
        <div id="cartPreview" class="cart-preview">
            <div class="cart-preview__block container flex-column">
                <div class="cart-preview__heading flex-row">
                    <h2 class="text--xs">Mi carrito</h2>
                    <button id="closeCartBtn" class="close-cart link" title="Cerrar carrito desplegable"><i class="ri-close-line"></i></button>
                </div>
                <div class="cart-preview__cards"></div>
                <div class="cart-preview__link flex-column">
                    <a href="cart.html" class="btn btn--dark" title="Ver el carrito de la compra">Ver el carrito completo</a>
                </div>
            </div>
        </div>
    </header>
    <!-- /Header -->
    <div id="blackLayer"></div> <!-- Capa oscurecida al abrir el menú -->
    <!-- Main: Contiene el contenido principal de la página web-->
    <main>
        <section class="product section">
            <div class="product__block container flex-row">
                <div class="product__image flex-column">
                    <picture>
                        <source src="media/cap.webp" type="image/webp">
                        <img src="media/cap.jpg" alt="Gorra de LoMás Fitness" loading="lazy">
                    </picture>
                </div>
                <div class="product__info flex-column">
                    <div class="product__header flex-column">
                        <h1 class="product__name text--sm">Gorra LoMás Fitness</h1>
                        <span class="product__price body">14,99 €</span>
                    </div>
                    <div class="product__size flex-row">
                        <a href="cap.html" class="product__link btn btn--dark" title="Gorra de LoMás Fitness">Gorra</a>
                        <a href="hoodie.html" class="product__link btn btn--dark" title="Sudadera de LoMás Fitness">Sudadera</a>
                        <a href="t-shirt.html" class="product__link btn btn--dark" title="Camiseta de LoMás Fitness">Camiseta</a>
                        <a href="straps.html" class="product__link btn btn--dark" title="Straps de LoMás Fitness">Straps</a>
                        <a href="shaker.html" class="product__link btn btn--dark" title="Shaker de LoMás Fitness">Shaker</a>
                    </div>
                    <div class="product__cart flex-row">
                        <button id="addProductBtn" class="btn btn--light" title="Añadir producto al carrito">Añadir a la cesta</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- /Main -->
    <!-- Footer: Contiene el logo, una serie de enlaces a páginas de la web y enlaces a las redes sociales de la empresa -->
    <footer class="footer section">
        <div class="footer__block flex-column">
            <div class="footer__links flex-row">
                <a href="index.html" title="Volver al inicio de la web desde el footer">
                    <picture>
                        <source srcset="media/logo.svg" type="image/svg+xml">
                        <img class="footer__logo" src="media/logo.jpg" loading="lazy" alt="Ir al inicio de la web desde el footer">
                    </picture>
                </a>
                <ul class="flex-row">
                    <li><a href="index.html" class="link" title="Enlace para volver al inicio de la web desde el footer">Inicio</a></li>
                    <li><a href="productos.html" class="link" title="Enlace para ir a nuestra página de productos desde el footer">Productos</a></li>
                    <li> <a href="contacto.html" class="link" title="Enlace para ir a nuestra página de contacto desde el footer">Contacto</a></li>
                </ul>
            </div>
            <div class="footer__social flex-row">
                <ul class="flex-row">
                    <li><a class="link" href="https://www.youtube.com/channel/UCF30QJNuAwfODaEH6VgB9Zw" target="_blank" rel="noreferrer" title="Canal de Youtube de LoMás Fitness"><i class="ri-youtube-fill"></i></a></li>
                    <li><a class="link" href="https://www.instagram.com/lomasfitness_oficial" target="_blank" rel="noreferrer" title="Instagram de LoMás Fitness"><i class="ri-instagram-fill"></i></a></li>
                    <li><a class="link" href="https://www.facebook.com/profile.php?id=61586266416811" target="_blank" rel="noreferrer" title="Facebook de LoMás Fitness"><i class="ri-facebook-fill"></i></a></li>
                    <li><a class="link" href="https://x.com/lomas_fitness" target="_blank" rel="noreferrer" title="Twitter de LoMás Fitness"><i class="ri-twitter-x-fill"></i></a></li>
                </ul>
                <div class="footer__copy">
                    <span class="body">&copy; 2026 LoMás Fitness</span>
                </div>
            </div>
        </div>
    </footer>
    <!-- /Footer -->
</body>
</html>
